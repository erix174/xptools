name: build WED

on:
  push:
    branches:
      - "wed_2*_release"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    # windows-2025 dropped the VS 2022 toolset and ships only VS 2026 (toolset
    # v18), which the installed CMake cannot target and which has no prebuilt
    # Conan dependency binaries. Stay on windows-2022 until the toolchain catches
    # up (matches build_xptools.yml).
    runs-on: windows-2022
    steps:
      - name: Checkout repo
        uses: actions/checkout@main
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Conan
        run: |
          pip install conan
          conan --version
      - name: Create Conan profile
        run: conan profile detect --force
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1.1
      - name: Build WorldEditor
        working-directory: ${{env.GITHUB_WORKSPACE}}
        # Add additional options to the MSBuild command line here (like platform or verbosity level).
        # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
        run: |
          ./cmake.ps1
          cmake --build vs_build --config Release
      - name: Archive build result
        uses: actions/upload-artifact@main
        with:
          name: artifact-win
          # WED reads its data files and flag art from beside the executable
          # (WedDataFileDir); CMake copies them there. Ship them with it.
          path: |
            vs_build/Release/WED.exe
            vs_build/Release/WED_AirportDatabase.txt
            vs_build/Release/flags

  build-mac:
    runs-on: macos-15
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@main
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Conan
        run: |
          pip install conan
          conan --version
      - name: Create Conan profile
        run: conan profile detect --force
      - name: Setup Credentials
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_DEV_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_DEV_CERTIFICATE_PASSWORD }}
      - name: "Build WorldEditor (universal - x86_64 + arm64)"
        # Intel Macs are still supported (Eric, 2026-09-27): one build per
        # architecture, joined with lipo - see scripts/build_mac_universal.sh.
        run: |
          pip install ninja
          bash scripts/build_mac_universal.sh
      - name: Sign App
        run: |
          codesign --deep --force --verify --verbose \
            --sign "Developer ID Application: Laminar Research (LPH4NFE92D)" \
            --options runtime \
            build_Universal/WED.app
      - name: Notarize App
        run: |
          ./scripts/notarization.sh WED.zip build_Universal/WED.app staple
      - name: Archive build result
        run: zip -r artifact-mac.zip build_Universal/WED.app
      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: artifact-mac
          path: artifact-mac.zip

  build-linux:
    runs-on: ubuntu-22.04
    # we need fltk-dev and python 2.7
    #container:
    #  image: ghcr.io/x-plane/xptools_builder:latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@main
        with:
          submodules: true
      - name: Install Python, pip and additional dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip pkg-config m4 autoconf automake libtool libglu1-mesa-dev libgl1-mesa-dev
      - name: Set up environment
        run: |
          echo "PATH=/usr/bin:$PATH" >> $GITHUB_PATH
      - name: Install Conan
        run: |
          pip3 install conan
          conan --version
      - name: Create Conan profile
        run: |
          conan profile detect --force
          conan remove --confirm "*"
      - name: Install Conan dependencies
        run: |
          conan install . --build=missing -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True
      - name: Build WorldEditor
        run: |
          ./cmake.sh
          cmake --build build_Release --config Release
      - name: Archive build result
        uses: actions/upload-artifact@main
        with:
          name: artifact-lin
          path: |
            build_Release/WED
            build_Release/WED_AirportDatabase.txt
            build_Release/flags

  create-zip-files:
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac, build-linux]
    steps:
      - name: Checkout repo
        uses: actions/checkout@main
      - name: get build results
        uses: actions/download-artifact@main
        with:
          # one folder per artifact: Windows and Linux both carry the data files
          pattern: artifact-*
      - name: zip files
        run: |
          version=$(grep 'WED_VERSION_FILENAME' src/WEDCore/WED_Version.h | awk -F'"' '{print $2}')
          echo "Version found: '$version'"
          cp src/WEDCore/README.WorldEditor .

          # Windows
          cp README.WorldEditor artifact-win/
          (cd artifact-win && zip -r ../wed_win_$version.zip README.WorldEditor WED.exe WED_AirportDatabase.txt flags)

          # Linux
          chmod a+x artifact-lin/WED
          cp README.WorldEditor artifact-lin/
          (cd artifact-lin && zip -r ../wed_lin_$version.zip README.WorldEditor WED WED_AirportDatabase.txt flags)

          # MacOS
          unzip artifact-mac/artifact-mac.zip
          chmod -R a+x build_Release/WED.app/Contents/MacOS/
          cp README.WorldEditor build_Release/
          cd build_Release
          zip -r ../wed_mac_$version.zip README.WorldEditor WED.app
          cd ..

      #    - name: copy to server           # run this conditional on being a "Release" or a special trigger
      #      uses: appleboy/scp-action@master
      #      with:
      #        host: files.x-plane.com
      #        username: ${{ secrets.USERNAME }}
      #        key: ${{ secrets.KEY }}      # private ssh key, public key goes on host
      #        source: wed_*.zip            # scp will overwrite target. find a way to check & NOT overwrite
      #        target: "public/wed/"
      - name: Archive zipfiles
        uses: actions/upload-artifact@main
        with:
          name: wed_release_build
          path: ./wed_*.zip
